{{ template "base" . }}
<div class="app" id="blog">
    <h1>{{.title}}</h1>
    {{if .post}}
    <div class="box">
        <p>{{ .post.Content }}</p>
    </div>
    <p id="primary_key">{{ .post.ID }}</p>
    <p id="slug">{{ .post.Slug }}</p>
    <a href="/blog/edit/{{.post.Slug}}" class="post_anchor">Edit</a>
    <button type="button" id="deleteButton">Delete</button>
    {{else}}
    <p>No blog post with this slug.</p>

    {{end}}
    <p id="message">Go get it.</p>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const deleteButton = document.getElementById('deleteButton');
        const editButton = document.getElementById('editButton');
        const messageDisplay = document.getElementById('message');
        const slug = document.getElementById('slug');
        const primaryKey = document.getElementById('primary_key');
        const postsEndpoint = `http://127.0.0.1:8080/blog/${primaryKey.textContent}`;


        // Function to handle DELETE request
        deleteButton.addEventListener('click', async () => {
            try {
                messageDisplay.textContent = 'Deleting item...';
                const response = await fetch(postsEndpoint, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (response.ok) {
                    messageDisplay.textContent = `Item ${slug} deleted successfully!`;
                    window.location.href = '/admin/blog/'
                } else {
                    const errorData = await response.json();
                    messageDisplay.textContent = `Error deleting item: ${errorData.message || response.statusText}`;
                }
            } catch (error) {
                messageDisplay.textContent = `Network error: ${error.message}`;
                console.error('Error during DELETE request:', error);
            }
        });
    });
</script>
