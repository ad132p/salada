{{ define "auth/logout.html" }}
{{ template "base" . }}
<div class="bg-gray-100 flex flex-col items-center justify-center p-4 min-h-screen">
    <div class="main max-w-md w-full text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">You have been logged out</h1>
        <p id="countdownTimer" class="text-xl text-gray-700 mb-6"></p>
        <a href="/" class="text-blue-600 hover:text-blue-800 font-semibold underline">Go to homepage</a>
    </div>
</div>
<script>
    let timeLeft = 10;
    const countdownElement = document.getElementById('countdownTimer');

    const downloadTimer = setInterval(function () {
        timeLeft--;
        countdownElement.textContent = "Redirecting to homepage in " + timeLeft + " seconds...";

        if (timeLeft <= 0) {
            clearInterval(downloadTimer);
            window.location.href = "/";
        }
    }, 1000);
</script>
{{ end }}
