{{ template "base" . }}
<h1>{{.title}}</h1>

<main>
    <form class="app" id="new-blog-post" method="post" action="/blog/" enctype="multipart/form-data">
        <fieldset>
            <legend>Post Details</legend>
            <input type="hidden" id="author" name="author" value="{{.username}}" />
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required placeholder="Enter your post title here">

                <label for="category_select">Category (Optional):</label>
                <select name="category" id="category_select">
                    <option value="">--Please choose an option--</option>
                    <option value="football">Football</option>
                    <option value="cs">Computer Science</option>
                    <option value="politics">Politics</option>
                    <option value="plants">Plants</option>
                    <option value="cine">Cinema</option>
                    <option value="lit">Literature</option>
                    <option value="random">Random</option>
                </select>


                <label for="tags">Tags (Comma,Space-separated, Optional):</label>
                <input type="text" name="tags" id="tags" placeholder="e.g., html, css, javascript">
            </div>
        </fieldset>


        <fieldset>
            <legend>Post Content</legend>
            <div class="form-group">
                <label for="content">Write your post content here:</label>
                <textarea name="content" id="content"></textarea>
            </div>
        </fieldset>

        <div class="form-actions">
            <button type="submit">Publish Post</button>
            <button type="reset">Clear Form</button>
        </div>
    </form>
</main>

<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
    const easyMDE = new EasyMDE({
        element: document.getElementById('content'),
        autofocus: true,
        imageAccept: "image/png, image/jpeg, image/jpg, image/webp",
        previewImagesInEditor: true,
        imageUploadEndpoint: "/blog/uploads",
        placeholder: "Start writing your blog post in Markdown...",
        spellChecker: true,
        toolbar: [
            "bold", "italic", "heading", "|",
            "unordered-list", "ordered-list", "code", "quote", "|",
            "link", "image", "upload-image", "|",
            "preview", "side-by-side", "fullscreen", "|",
            "guide"
        ],
    });
</script>
