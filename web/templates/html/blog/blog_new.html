{{ define "blog/blog_new.html" }}
{{ template "base" . }}
<div class="bg-gray-100 p-4">
    <div class="container mx-auto max-w-4xl py-8">
        <div class="bg-white rounded-lg shadow-xl p-8 space-y-8 prose max-w-none">
            <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">{{.title}}</h1>
            <form class="space-y-6" id="new-blog-post" method="post" action="/blog/" enctype="multipart/form-data">
                <fieldset class="border border-gray-200 rounded-lg p-6 space-y-4">
                    <legend class="text-lg font-semibold text-gray-800 px-2">Post Details</legend>
                    <input type="hidden" id="author" name="author" value="{{.username}}" />
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title:</label>
                        <input type="text" name="title" id="title" required placeholder="Enter your post title here"
                            class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>

                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category
                            (Optional):</label>
                        <select name="category" id="category" required
                            class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            <option value="">Please choose an option</option>
                            <option value="football">Football</option>
                            <option value="cs">Computer Science</option>
                            <option value="politics">Politics</option>
                            <option value="plants">Plants</option>
                            <option value="cine">Cinema</option>
                            <option value="lit">Literature</option>
                            <option value="random">Random</option>
                        </select>
                    </div>

                    <div>
                        <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">Tags (Comma-separated,
                            Optional):</label>
                        <input type="text" name="tags" id="tags" placeholder="e.g., html, css, javascript"
                            class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </fieldset>

                <fieldset class="border border-gray-200 rounded-lg p-6 space-y-4">
                    <legend class="text-lg font-semibold text-gray-800 px-2">Post Content</legend>

                    <!-- Hero Image Cropper Container -->
                    <div id="hero-cropper"></div>
                    <input type="hidden" id="thumbnail_position" name="thumbnail_position" value="center 50%" />

                    <div>
                        <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Write your post
                            content here:</label>
                        <textarea name="content" id="content"
                            class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm min-h-[300px]"></textarea>
                    </div>
                </fieldset>

                <div class="flex space-x-4 justify-end">
                    <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
                        Publish Post
                    </button>
                    <button type="reset"
                        class="bg-gray-400 hover:bg-gray-500 text-white font-medium py-2 px-6 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors duration-200">
                        Clear Form
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    // 1. Declare the global data structure (array) to store the UUIDs
    // This array will hold the list of image IDs for form submission.
    const uploadedImageUUIDs = [];

    const imageMonitorStatus = {
        // The unique name for your status bar item
        className: "image-uuid-monitor",
        // The element to be displayed. Start with a neutral message.
        defaultValue: "Image Uploads: None" // The default value set by EasyMDE
    };

    /**
     * Updates the status bar and, more importantly, adds the new UUID 
     * to the global uploadedImageUUIDs array.
     * @param {string} newUUID - The unique ID of the newly uploaded image.
     */
    function updateImageMonitor(newUUID) {
        // Push the new UUID into the global array.
        // This is the array you will use for your form submission.
        uploadedImageUUIDs.push(newUUID);
        console.log("UUID added to array:", newUUID);
        console.log("Current UUIDs Array:", uploadedImageUUIDs); // Log the array

        // --- Status Bar Update (Original Logic - Kept for visibility) ---
        const monitorElement = document.querySelector('.' + imageMonitorStatus.className);

        if (!monitorElement) {
            console.error("Image Monitor element not found. Check EasyMDE setup.");
            return;
        }

        // The status bar text can now be directly based on the global array contents
        if (uploadedImageUUIDs.length === 0) {
            monitorElement.textContent = imageMonitorStatus.defaultValue;
        } else {
            monitorElement.textContent = `Image Uploads: ${uploadedImageUUIDs.join(', ')}`;
        }

        console.log("Status bar text updated.");
    }

    // You should also consider a function to remove a UUID if an image is removed from the editor, 
    // but for simple uploading, the above is enough.

    async function customImageUpload(file, onSuccess, onError) {

        // Use FormData to package the file for the POST request
        const formData = new FormData();
        formData.append("image", file);

        try {
            const response = await fetch('/blog/uploads/', {
                method: 'POST',
                body: formData,
                // Add any necessary headers like JWT/CSRF tokens here
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Image upload failed on server:", errorText);
                onError("Upload Failed: " + errorText);
                return;
            }

            const payload = await response.json()

            // Assuming the server response is { data: { image_id: "...", filepath: "..." } }
            // **This is where the function to update the array is called.**
            updateImageMonitor(payload.data.image_id);

            // Dispatch event for HeroImageCropper - REMOVED in favor of content watching
            // const event = new CustomEvent('hero-image-uploaded', { detail: { filepath: payload.data.filepath } });
            // window.dispatchEvent(event);

            onSuccess(payload.data.filepath);

        } catch (error) {
            console.error("Network or parsing error:", error);
            onError("Network Error: " + error.message);
        }
    }

    const easyMDE = new EasyMDE({
        element: document.getElementById('content'),
        autofocus: true,
        imageMaxSize: 1024 * 1024 * 8,
        imageAccept: "image/png, image/jpeg, image/jpg, image/webp",
        status: ["autosave", "lines", "words", "cursors", imageMonitorStatus],
        previewImagesInEditor: true,
        previewClass: ["h-200", "w-96", "object-scale-down"],
        imageUploadFunction: customImageUpload,
        imagePathAbsolute: true,
        placeholder: "Start writing your blog post in Markdown...",
        spellChecker: true,
        toolbar: [
            "bold", "italic", "heading", "|",
            "unordered-list", "ordered-list", "code", "quote", "|",
            "link", "upload-image", "|",
            "preview", "side-by-side", "fullscreen", "|",
            "guide"
        ],
    });

    // Watch for changes in the editor content to update the Hero Image Preview
    easyMDE.codemirror.on("change", function () {
        const content = easyMDE.value();
        // Regex to find the first image in markdown: ![alt](url)
        const match = content.match(/!\[.*?\]\((.*?)\)/);
        let firstImage = match ? match[1] : null;

        if (firstImage) {
            // Strip title if present (e.g. url "title")
            const titleIndex = firstImage.indexOf(' "');
            if (titleIndex !== -1) {
                firstImage = firstImage.substring(0, titleIndex);
            }
        }

        window.dispatchEvent(new CustomEvent('hero-image-change', { detail: { filepath: firstImage } }));
    });


    document.getElementById('new-blog-post').addEventListener('submit', async function (event) {
        // Prevent the default form submission for now
        event.preventDefault();

        const title = document.getElementById('title').value;
        const tags = document.getElementById('tags').value;
        const category = document.getElementById('category').value;
        const content = easyMDE.value();

        const submissionData = {
            title: title,
            content: content,
            tags: tags,
            category: category,
            category: category,
            image_ids: uploadedImageUUIDs,
            thumbnail_position: document.getElementById('thumbnail_position').value
        };
        try {
            const response = await fetch('/blog/', { method: 'POST', body: JSON.stringify(submissionData) })
            if (!response.ok) {
                const errorText = await response.text();
                console.error("Image upload failed on server:", errorText);
            }
        } catch (error) {
            console.error("Network or parsing error:", error);
            onError("Network Error: " + error.message);
            window.location.replace("/denied");
        }
        window.location.replace("/thankyou");

    });
</script>
<style>
    /* Target the live image preview span within the CodeMirror editor */
    .CodeMirror span[role="presentation"][data-img-src] {
        /* Set a fixed size for the preview area */
        width: 400px !important;
        /*height: 100px !important; */

        /* Override any default display/positioning if necessary */
        display: inline-block !important;
        /* or block, depending on your layout need */

        /* Ensure the background image scales down to fit the new size */
        background-size: contain !important;
        /* or cover, depending on desired crop */
        background-repeat: no-repeat !important;
        background-position: center !important;

        /* Add a border to visualize the new boundary (optional) */
        border: 1px solid #ccc;
    }
</style>

{{ end }}
