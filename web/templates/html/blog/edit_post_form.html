{{ define "blog/edit_post_form.html" }}
{{ template "base" . }}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-xl p-8 lg:p-12">
    <h1 class="text-3xl lg:text-4xl font-extrabold text-gray-900 leading-tight mb-6">{{.title}}</h1>
    <main class="space-y-8">
      <div class="space-y-6">
        <fieldset class="border border-gray-300 rounded-md p-6">
          <legend class="text-lg font-semibold text-gray-700 px-2">Post Details</legend>
          <div class="space-y-4">
            <p id="primary_key" name="primary_key" class="hidden">{{ .post.ID }}</p>
            <p id="slug" class="hidden">{{ .post.Slug }}</p>

            <div class="space-y-2">
              <label for="title" class="block text-sm font-medium text-gray-700">Title:</label>
              <input type="text" name="title" id="title" value="{{.post.Title}}" required
                placeholder="Enter your post title here"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
              <label for="category_select" class="block text-sm font-medium text-gray-700 mb-1">Category
                (Optional):</label>
              <select name="category" id="category_select"
                class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <option disabled value="">--Please choose an option--</option>
                {{range $index, $element := .categories}}
                <option value="{{ $element }}" {{ $element }} {{if eq $element $.post.Category}}selected{{end}}>
                  {{$element}}</option>
                {{ end }}
              </select>
            </div>
            <div class="space-y-2">
              <label for="tags" class="block text-sm font-medium text-gray-700">Tags (Comma-separated,
                Optional):</label>
              </label>

              <input type="text" name="tags" id="tags" value="{{range .post.Tags}}{{.}},{{end}}"
                placeholder="e.g., html, css, javascript"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
          </div>
        </fieldset>

        <fieldset class="border border-gray-300 rounded-md p-6">
          <legend class="text-lg font-semibold text-gray-700 px-2">Post Content</legend>

          <!-- Hero Image Cropper Container -->
          <div id="hero-cropper" data-initial-image="{{.post.ThumbnailURL}}"
            data-initial-position="{{.post.ThumbnailPosition}}"></div>
          <input type="hidden" id="thumbnail_position" name="thumbnail_position" value="{{.post.ThumbnailPosition}}" />

          <div class="space-y-2">
            <label for="content" class="block text-sm font-medium text-gray-700">Write your post content here:</label>
            <textarea name="content" id="content"
              class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm min-h-[300px]">{{.post.Content}}</textarea>
          </div>
        </fieldset>
      </div>

      <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
        <button id="edit_button"
          class="flex-1 py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Edit Post
        </button>
      </div>
      <p id="message" class="mt-4 text-center text-sm text-gray-600 italic">oof</p>
    </main>
  </div>
</div>
{{ template "footer" . }}
<script>
  // 1. Declare the global data structure (array) to store the UUIDs
  // This array will hold the list of image IDs for form submission.
  const uploadedImageUUIDs = [];

  const imageMonitorStatus = {
    // The unique name for your status bar item
    className: "image-uuid-monitor",
    // The element to be displayed. Start with a neutral message.
    defaultValue: "Image Uploads: None" // The default value set by EasyMDE
  };

  /**
   * Updates the status bar and, more importantly, adds the new UUID 
   * to the global uploadedImageUUIDs array.
   * @param {string} newUUID - The unique ID of the newly uploaded image.
   */
  function updateImageMonitor(newUUID) {
    // Push the new UUID into the global array.
    // This is the array you will use for your form submission.
    uploadedImageUUIDs.push(newUUID);
    console.log("UUID added to array:", newUUID);
    console.log("Current UUIDs Array:", uploadedImageUUIDs); // Log the array

    // --- Status Bar Update (Original Logic - Kept for visibility) ---
    const monitorElement = document.querySelector('.' + imageMonitorStatus.className);

    if (!monitorElement) {
      console.error("Image Monitor element not found. Check EasyMDE setup.");
      return;
    }

    // The status bar text can now be directly based on the global array contents
    if (uploadedImageUUIDs.length === 0) {
      monitorElement.textContent = imageMonitorStatus.defaultValue;
    } else {
      monitorElement.textContent = `Image Uploads: ${uploadedImageUUIDs.join(', ')}`;
    }

    console.log("Status bar text updated.");
  }

  // You should also consider a function to remove a UUID if an image is removed from the editor, 
  // but for simple uploading, the above is enough.

  async function customImageUpload(file, onSuccess, onError) {

    // Use FormData to package the file for the POST request
    const formData = new FormData();
    formData.append("image", file);

    try {
      const response = await fetch('/blog/uploads/', {
        method: 'POST',
        body: formData,
        // Add any necessary headers like JWT/CSRF tokens here
      });

      if (!response.ok) {
        const errorText = await response.text();
        console.error("Image upload failed on server:", errorText);
        onError("Upload Failed: " + errorText);
        return;
      }

      const payload = await response.json()

      // Assuming the server response is { data: { image_id: "...", filepath: "..." } }
      // **This is where the function to update the array is called.**
      updateImageMonitor(payload.data.image_id);
      onSuccess(payload.data.filepath);

    } catch (error) {
      console.error("Network or parsing error:", error);
      onError("Network Error: " + error.message);
    }
  }

  const easyMDE = new EasyMDE({
    element: document.getElementById('content'),
    autofocus: true,
    imageMaxSize: 1024 * 1024 * 8,
    imageAccept: "image/png, image/jpeg, image/jpg, image/webp",
    status: ["autosave", "lines", "words", "cursors", imageMonitorStatus],
    previewImagesInEditor: true,
    previewClass: ["h-200", "w-96", "object-scale-down"],
    imageUploadFunction: customImageUpload,
    imagePathAbsolute: true,
    placeholder: "Start writing your blog post in Markdown...",
    spellChecker: true,
    toolbar: [
      "bold", "italic", "heading", "|",
      "unordered-list", "ordered-list", "code", "quote", "|",
      "link", "upload-image", "|",
      "preview", "side-by-side", "fullscreen", "|",
      "guide"
    ],
  });

  // Watch for changes in the editor content to update the Hero Image Preview
  easyMDE.codemirror.on("change", function () {
    const content = easyMDE.value();
    // Regex to find the first image in markdown: ![alt](url)
    // Capture everything inside the parentheses
    const match = content.match(/!\[.*?\]\((.*?)\)/);
    let firstImage = match ? match[1] : null;

    if (firstImage) {
      // Strip title if present (e.g. url "title")
      const titleIndex = firstImage.indexOf(' "');
      if (titleIndex !== -1) {
        firstImage = firstImage.substring(0, titleIndex);
      }
    }

    window.dispatchEvent(new CustomEvent('hero-image-change', { detail: { filepath: firstImage } }));
  });

  const editButton = document.getElementById("edit_button");
  const messageDisplay = document.getElementById("message");
  const titleInput = document.getElementById('title');
  const tagsInput = document.getElementById('tags');
  const categoryInput = document.getElementById('category_select');
  const slug = document.getElementById('slug');
  const primaryKey = document.getElementById('primary_key');

  editButton.addEventListener('click', async () => {
    const updateUrl = `/blog/${primaryKey.textContent}`;
    const data = {
      ID: primaryKey.textContent,
      title: titleInput.value,
      content: easyMDE.value(),
      tags: tagsInput.value,
      category: categoryInput.value,
      image_ids: uploadedImageUUIDs,
      thumbnail_position: document.getElementById('thumbnail_position').value
    };

    try {
      messageDisplay.textContent = 'Updating item...';
      const response = await fetch(updateUrl, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
      });

      if (response.ok) {
        const responseData = await response.json();
        messageDisplay.textContent = `Item ${slug.textContent} updated successfully!`;
      } else {
        const errorData = await response.json();
        messageDisplay.textContent = `Error updating item: ${errorData.message || response.statusText}`;
      }
    } catch (error) {
      messageDisplay.textContent = `Network error: ${error.message}`;
      console.error('Error during PUT request:', error);
    }
  });
</script>
<style>
  /* Target the live image preview span within the CodeMirror editor */
  .CodeMirror span[role="presentation"][data-img-src] {
    /* Set a fixed size for the preview area */
    width: 400px !important;
    /*height: 100px !important; */

    /* Override any default display/positioning if necessary */
    display: inline-block !important;
    /* or block, depending on your layout need */

    /* Ensure the background image scales down to fit the new size */
    background-size: contain !important;
    /* or cover, depending on desired crop */
    background-repeat: no-repeat !important;
    background-position: center !important;

    /* Add a border to visualize the new boundary (optional) */
    border: 1px solid #ccc;
  }
</style>

{{ end }}
