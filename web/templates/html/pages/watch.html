{{ define "pages/watch.html" }}
{{ template "base" . }}
<div class="container mx-auto max-w-6xl py-8 flex-grow px-4">
  <!-- Video Viewer React Component -->
  <div id="video-viewer" data-ws-url="/stream/ws?room={{ .streamer }}" data-streamer="{{ .streamer }}"
    data-viewer-count="{{ .viewer_count }}" data-is-logged-in="{{ .is_logged_in }}"
    data-ice-servers="{{ .ice_servers }}">
    <p class="text-center text-gray-500 py-12">Loading video player...</p>
  </div>
</div>
{{ end }}
