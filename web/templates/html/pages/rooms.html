{{ define "pages/rooms.html" }}
{{ template "base" . }}
<div class="container mx-auto max-w-6xl py-8 flex-grow px-4">
  <div class="mb-8">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">Rooms</h1>
    <p class="text-gray-600">Join a live stream or start your own.</p>
  </div>

  <!-- Rooms List React Component -->
  <div id="rooms-list" data-is-logged-in="{{ .is_logged_in }}" class="min-h-[300px]">
    <p class="text-center text-gray-500 py-12">Loading rooms...</p>
  </div>
</div>
{{ template "footer" . }}
{{ end }}
