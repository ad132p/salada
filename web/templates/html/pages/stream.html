{{ define "pages/stream.html" }}
{{ template "base" . }}
<div class="container mx-auto max-w-6xl py-8 min-h-screen px-4">
  <div class="mb-8">
    <h1 class="text-4xl font-bold text-gray-900 mb-2">Video Stream</h1>
    <p class="text-gray-600">You are streaming as <strong>{{ .username }}</strong></p>
  </div>

  <!-- Video Streamer React Component -->
  <div id="video-streamer" data-ws-url="/stream/ws" data-username="{{ .username }}" data-mode="stream"
    class="bg-white rounded-lg shadow-lg p-6">
    <p class="text-center text-gray-500">Loading video streamer...</p>
  </div>

  <!-- Info box -->
  <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
    <div class="flex items-start gap-3">
      <svg class="w-6 h-6 text-blue-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <div>
        <h3 class="font-semibold text-blue-900">How it works</h3>
        <p class="text-blue-800 text-sm mt-1">
          Start streaming to make your room visible on <a href="/rooms" class="underline font-medium">Live Rooms</a>.
          Viewers can join at <code class="bg-blue-100 px-1 rounded">/rooms/{{ .username }}</code>.
        </p>
      </div>
    </div>
  </div>
</div>
{{ template "footer" . }}
{{ end }}
