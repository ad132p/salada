{{ template "base" . }}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-xl p-8 lg:p-12">
    <h1 class="text-3xl lg:text-4xl font-extrabold text-gray-900 leading-tight mb-6">{{.title}}</h1>
    <main class="space-y-8">
      <div class="space-y-6">
        <fieldset class="border border-gray-300 rounded-md p-6">
          <legend class="text-lg font-semibold text-gray-700 px-2">Post Details</legend>
          <div class="space-y-4">
            <p id="primary_key" name="primary_key" class="hidden">{{ .post.ID }}</p>
            <p id="slug" class="hidden">{{ .post.Slug }}</p>

            <div class="space-y-2">
              <label for="title" class="block text-sm font-medium text-gray-700">Title:</label>
              <input type="text" name="title" id="title" value="{{.post.Title}}" required
                placeholder="Enter your post title here"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
              <label for="category_select" class="block text-sm font-medium text-gray-700 mb-1">Category
                (Optional):</label>
              <select name="category" id="category_select"
                class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <option disabled value="">--Please choose an option--</option>
                {{range $index, $element := .categories}}
                <option value="{{ $element }}">{{ $element }}</option>
                {{ end }}
              </select>
            </div>

            <div class="space-y-2">
              <label for="tags" class="block text-sm font-medium text-gray-700">Tags (Comma-separated,
                Optional):</label>


              </label>

              <input type="text" name="tags" id="tags" value="{{range .post.TagsJSON}}{{.}},{{end}}"
                placeholder="e.g., html, css, javascript"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
          </div>
        </fieldset>

        <fieldset class="border border-gray-300 rounded-md p-6">
          <legend class="text-lg font-semibold text-gray-700 px-2">Post Content</legend>
          <div class="space-y-2">
            <label for="content" class="block text-sm font-medium text-gray-700">Write your post content here:</label>
            <textarea name="content" id="content"
              class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm min-h-[300px]">{{.post.Content}}</textarea>
          </div>
        </fieldset>
      </div>

      <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
        <button id="edit_button"
          class="flex-1 py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Edit Post
        </button>
        <button type="reset"
          class="flex-1 py-2 px-4 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Clear Form
        </button>
      </div>
      <p id="message" class="mt-4 text-center text-sm text-gray-600 italic">oof</p>
    </main>
  </div>
</div>
{{ template "footer" . }}
<script>
  const easyMDE = new EasyMDE({
    element: document.getElementById('content'),
    autofocus: true,
    imageMaxSize: 1024 * 1024 * 8,
    imageAccept: "image/png, image/jpeg, image/jpg, image/webp",
    previewImagesInEditor: true,
    imageUploadEndpoint: "/blog/uploads",
    placeholder: "Start writing your blog post in Markdown...",
    spellChecker: true,
    maxHeight: 200,
    toolbar: [
      "bold", "italic", "heading", "|",
      "unordered-list", "ordered-list", "code", "quote", "|",
      "link", "image", "upload-image", "|",
      "preview", "side-by-side", "fullscreen", "|",
      "guide"
    ],
  });

  const editButton = document.getElementById("edit_button");
  const messageDisplay = document.getElementById("message");
  const titleInput = document.getElementById('title');
  const tagsInput = document.getElementById('tags');
  const categoryInput = document.getElementById('category_select');
  const slug = document.getElementById('slug');
  const primaryKey = document.getElementById('primary_key');

  editButton.addEventListener('click', async () => {
    const updateUrl = `/blog/${primaryKey.textContent}`;
    const data = {
      ID: primaryKey.textContent,
      title: titleInput.value,
      content: easyMDE.value(),
      tags: tagsInput.value,
      slug: slug.textContent,
      category: categoryInput.value
    };

    try {
      messageDisplay.textContent = 'Updating item...';
      const response = await fetch(updateUrl, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
      });

      if (response.ok) {
        const responseData = await response.json();
        messageDisplay.textContent = `Item ${slug.textContent} updated successfully!`;
      } else {
        const errorData = await response.json();
        messageDisplay.textContent = `Error updating item: ${errorData.message || response.statusText}`;
      }
    } catch (error) {
      messageDisplay.textContent = `Network error: ${error.message}`;
      console.error('Error during PUT request:', error);
    }
  });
</script>
