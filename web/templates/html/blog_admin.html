{{ template "base" . }}
<div class="app" id="blog">
  <h1>{{.title}}</h1>
  {{if .posts}}
  <div class="box">

      {{range .posts}}
      <article>
        <h2><a href="/admin/blog/{{.Slug}}" class="post_anchor">{{.Title}}</a></h2>
        <p>Published: {{ or .PublishedAt "NO"}} </p>
        <p>Author: {{.AuthorName}} </p>
      </article>
      {{end}}
  </div>
  {{else}}
  <p>{{.error}}</p>
  {{end}}
</div>
