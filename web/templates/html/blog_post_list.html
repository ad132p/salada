{{ template "base" . }}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-5xl mx-auto"> <h1 class="text-4xl font-extrabold text-gray-900 mb-8">{{.title}}</h1>

    {{if .posts}}
    <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Title
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sm:table-cell">
              Summary
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Published
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider md:table-cell">
              Author
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          {{range .posts}}
          <tr class="hover:bg-gray-50 transition duration-150 ease-in-out">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">
                <a href="/blog/{{.Slug}}" class="hover:text-indigo-600 transition-colors duration-200">
                  {{.Title}}
                </a>
              </div>
            </td>
            <td class="px-6 py-4 text-sm text-gray-500 sm:table-cell">
              {{ printf "%.30s" .Content }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              {{ printf "%.19s" .PublishedAt }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 md:table-cell">
              {{ or .AuthorName "anon" }}
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
    {{else}}
    <p class="text-center text-lg text-gray-600 mt-12">{{.error}}</p>
    {{end}}
    <a href="/blog/">Go back</a>
  </div>
</div>
