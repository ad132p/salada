{{ template "base" . }}
<div class="app" id="blog">

  {{ if .username }} 
  <h1>Hello, {{.username}}</h1>
  <button type="button" id="logoutButton">Logout</button>
  {{ else }}
<h1>Hello, anon</h1>
  {{ end }}

  {{if .posts}}
  <div class="box">

    {{range .posts}}
    <article>
      <h2><a href="/blog/{{.Slug}}" class="post_anchor">{{.Title}}</a></h2>
      <p>Published: {{.PublishedAt}}</p>
    </article>
    {{end}}
  </div>
  {{else}}
  <p>No blog posts available.</p>
  {{end}}
  <a href="/blog/new/">New blog</a>
</div>
<p id="message">Go get it.</p>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const logoutButton = document.getElementById('logoutButton');
        const logoutEndpoint = `http://127.0.0.1:8080/logout`;
        const messageDisplay = document.getElementById('message');
        // Function to handle POST update request
        logoutButton.addEventListener('click', async () => {
            try {
                const response = await fetch(logoutEndpoint, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok)  {
                    const errorData = await response.json();
                    messageDisplay.textContent = `Error publishing item: ${errorData.message || response.statusText}`;
                }
            } catch (error) {
                messageDisplay.textContent = `Network error: ${error.message}`;
                console.error('Error during PATCH request:', error);
            }
        });
    });
</script>
