{{ template "base" . }}
<div class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
  <div class="main max-w-2xl w-full text-center p-8 bg-white rounded-lg shadow-lg space-y-8 mt-12 mb-12">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-6">{{.title}}</h1>

    {{if .posts}}
    <div class="w-full space-y-4 text-left">
      {{range .posts}}
      <article class="bg-white p-6 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors duration-200">
        <h2 class="text-xl font-semibold mb-2">
          <a href="/blog/{{.Slug}}"
            class="post_anchor text-blue-600 hover:text-blue-800 hover:underline transition-colors duration-200">
            {{.Title}}
          </a>
        </h2>
        <p class="text-sm text-gray-500">Published: {{.PublishedAt}}</p>
        <p class="text-sm text-gray-500">Author: {{.AuthorName}}</p>
        <p class="text-sm text-gray-500">Category: {{.Category}}</p>
        <p class="text-sm text-gray-500" id="hashtag-output"></p>
        <input type="hidden" id="tags" name="tags" value="{{.TagsJSON}}" />
      </article>
      {{end}}
    </div>
    {{else}}
    <p class="text-lg text-gray-600">No blog posts available.</p>
    {{.error}}
    {{end}}

    <div class="w-full flex justify-center mt-8 space-x-4">
      <a href="/blog/new/"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200">New
        blog</a>
      {{ if .username }}
      <form action="/logout" method="get">
        <input type="hidden" id="username" name="username" value="{{.username}}" />
        <input type="submit" value="Logout!"
          class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200 cursor-pointer" />
      </form>
      {{ end }}
    </div>
  </div>
</div>
<script>
  // Function to handle the process of getting the data and yielding hashtags
  function yieldHashtags() {
    // 1. Get the element containing the string data
    const tagsElement = document.getElementById('tags');

    // If the element doesn't exist, log an error and stop
    if (!tagsElement) {
      console.error("Element with ID 'tags' not found.");
      return;
    }

    // 2. Get the string content from the element
    const arrayAsString = tagsElement.value;
    let jsArray = [];

    // Use a try-catch block to safely parse the JSON string
    try {
      jsArray = JSON.parse(arrayAsString);
    } catch (e) {
      console.error("Failed to parse the string as a JSON array:", e);

      return;
    }

    // 3. Convert the array elements into a string of hashtag links
    const hashtagString = jsArray.map(item => {
      // Create an <a> tag for each item
      // Use encodeURIComponent to handle spaces and special characters in links
      return `<a href="#${encodeURIComponent(item.replace(/\s/g, ''))}">#${item}</a>`;
    }).join(' '); // Join the tags with a space

    // 4. Inject the created string into a new HTML element
    const outputElement = document.getElementById('hashtag-output');
    if (outputElement) {
      outputElement.innerHTML = hashtagString;
    } else {
      console.error("Element with ID 'hashtag-output' not found.");
    }
  }

  // Call the function to run the process
  document.addEventListener('DOMContentLoaded', yieldHashtags);
</script>
