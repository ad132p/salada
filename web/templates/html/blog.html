{{ template "base" . }}
<div class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
  <div class="main max-w-2xl w-full text-center p-8 bg-white rounded-lg shadow-lg space-y-8 mt-12 mb-12">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-6">{{.title}}</h1>

    {{if .posts}}
    <div class="w-full space-y-4 text-left">
      {{range .posts}}
      <article class="bg-white p-6 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors duration-200">
        <h2 class="text-xl font-semibold mb-2">
          <a href="/blog/{{.Slug}}"
            class="post_anchor text-blue-600 hover:text-blue-800 hover:underline transition-colors duration-200">
            {{.Title}}
          </a>
        </h2>
        <p class="text-sm text-gray-500">Published: {{.PublishedAt}}</p>
        <p class="text-sm text-gray-500">Author: {{.AuthorName}}</p>
      </article>
      {{end}}
    </div>
    {{else}}
    <p class="text-lg text-gray-600">No blog posts available.</p>
    {{end}}

    <div class="w-full flex justify-center mt-8 space-x-4">
      <a href="/blog/new/"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200">New
        blog</a>
      {{ if .username }}
      <form action="/logout" method="get">
        <input type="hidden" id="username" name="username" value="{{.username}}" />
        <input type="submit" value="Logout!"
          class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200 cursor-pointer" />
      </form>
      {{ end }}
    </div>
  </div>
</div>
