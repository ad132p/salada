{{ template "base" . }}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-xl p-8 lg:p-12">
    {{if .post}}
    <h1 class="text-4xl lg:text-5xl font-extrabold text-gray-900 leading-tight mb-4">{{.title}}</h1>
    
    <div class="prose prose-lg max-w-none text-gray-800 mb-8">
      {{ .content }}
    </div>
    
    <p class="text-center text-xl text-gray-600 font-medium mb-12 border-t pt-4">
        Accessed {{ .post.Seen }} times.
    </p>

    <div class="mt-12 pt-6 border-t border-gray-200">
        <h3 class="text-2xl font-bold text-gray-800 mb-6">Leave a Comment</h3>
        
        <form action="/comments/{{.post.Slug}}" method="POST" class="space-y-4">
            <div>
                <label for="comment-text" class="sr-only">Your Comment</label>
                <textarea 
                    id="comment-text" 
                    name="comment" 
                    rows="4" 
                    required
                    class="w-full p-4 text-gray-700 bg-gray-50 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out resize-none shadow-sm"
                    placeholder="Share your thoughts on this post..."
                ></textarea>
            </div>
            
            <div class="flex justify-end">
                <button 
                    type="submit"
                    class="px-6 py-3 text-lg font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 focus:outline-none transition duration-150 ease-in-out shadow-md"
                >
                    Submit Comment
                </button>
            </div>
        </form>
    </div>
    {{else}}
    <p class="text-center text-xl text-gray-600 font-medium">No blog post with this slug.</p>
    {{end}}
  </div>
</div>
